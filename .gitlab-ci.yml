---

workflow:
  rules:
    # Do not run branch pipelines for deprecated master.
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    # Run pipelines for merge requests targeting main.
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
      when: always
    # Run pipeline for pushes to main.
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: always
    # Run pipeline when creating tags
    - if: '$CI_COMMIT_TAG'
      when: always
    # Run scheduled pipelines on main.
    - if: >-
        $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"
      when: always
    # Allow manual pipelines on main.
    - if: >-
        $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"
      when: always
    # Do not run pipeline for other cases
    - when: never

stages:
  - build
  - test
  - deploy
  - cleanup

variables:
  LANGUAGE: "en_US:en"
  LANG: "en_US"
  LC_ALL: C
  TMPDIR: ${PYKU_CI_SCRATCH}/tmp
  RUNNER_DATA: ${PYKU_CI_WORK}/gitlab-runner-data/
  PYKU_DATA_DIR: ${RUNNER_DATA}/pyku_data_dir
  PYKU_ENVIRONMENT: ${RUNNER_DATA}/pyku/${CI_PIPELINE_ID}

.load_modules:
  before_script:
    - echo "Use modules"
    - module use $PYKU_CI_MODULEDIR/modulesfiles
    - module purge
    - module load envs
    - module load base/eclair-cake
    - module load uv

install-wheel:
  stage: build
  extends: .load_modules
  tags:
    - ku1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Create python virtual environment, build and install wheel"
    - uv venv $PYKU_ENVIRONMENT/venv
    - source $PYKU_ENVIRONMENT/venv/bin/activate
    - uv pip install --upgrade pip setuptools
    - uv pip install wheel cython nbstripout build
    - uv build
    - WHEEL_FILE=$(find . -name "*.whl")
    - uv pip install $WHEEL_FILE[documentation,cdo_bindings]

verify_clear_notebooks:
  stage: test
  extends: .load_modules
  tags:
    - ku1
  script:
    - echo "Activate python environment"
    - source $PYKU_ENVIRONMENT/venv/bin/activate
    - echo "Verify notebooks are clear"
    - ipython ./testing/check_notebooks_are_cleared.ipy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

verify_style_guideline:
  stage: test
  extends: .load_modules
  tags:
    - ku1
  script:
    - echo "Activate python environment and install flake8"
    - source $PYKU_ENVIRONMENT/venv/bin/activate
    - uv pip install flake8 || exit 1
    - echo "Verify style guidelines are enforced"
    - flake8 pyku/
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

unit-testing:
  stage: test
  tags:
    - ku1
  parallel:
    matrix:
      - cake_module: ['durian-cake', 'eclair-cake']
  before_script:
    - module use $PYKU_CI_MODULEDIR/modulesfiles
    - module purge
    - module load envs
    - module load base/${cake_module}
    - module load uv
    - |
      uv venv $PYKU_ENVIRONMENT/${cake_module}
      source $PYKU_ENVIRONMENT/${cake_module}/bin/activate
      uv pip install --upgrade pip setuptools
      uv pip install wheel cython nbstripout build pytest
      uv build
      WHEEL_FILE=$(find . -name "*.whl")
      uv pip install $WHEEL_FILE[documentation,cdo_bindings]
  script:
    - echo "Activate python environment"
    - source $PYKU_ENVIRONMENT/${cake_module}/bin/activate
    - echo "Run test units"
    - pytest testing/ -v --tb=short
  after_script:
    - rm -rf $PYKU_ENVIRONMENT/${cake_module}

.documentation:
  stage: test
  tags:
    - ku1
  extends: .load_modules
  script:
    - echo "Activate python environment"
    - source $PYKU_ENVIRONMENT/venv/bin/activate
    - echo "Build documentation"
    - sphinx-build -j 10 ./doc/ documentation/
    - |
      if [ ! -s ./doc/savefig/mask_get_mask.png ]; then
        echo "Missing generated documentation image: mask_get_mask.png" >&2
        exit 1
      fi

documentation:
  extends: .documentation
  artifacts:
    paths:
      - documentation
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

verify-release-notes:
  stage: test
  extends: .load_modules
  tags:
    - ku1
  script:
    - source $PYKU_ENVIRONMENT/venv/bin/activate
    - >-
      python scripts/changelog_release_notes.py "$CI_COMMIT_TAG"
      --format html > release-notes.html
  artifacts:
    paths:
      - release-notes.html
  rules:
    - if: '$CI_COMMIT_TAG'


pypi-deploy:
  stage: deploy
  tags:
    - ku1
  extends: .load_modules
  variables:
    UV_PUBLISH_USERNAME: "gitlab-ci-token"
    UV_PUBLISH_PASSWORD: "${CI_JOB_TOKEN}"
  script:
    - echo "Activate python environment at ${PYKU_ENVIRONMENT}"
    - source $PYKU_ENVIRONMENT/venv/bin/activate
    - echo "Build wheel"
    - uv build
    - echo "Deploy to pyku package registry"
    - >-
      uv publish --publish-url
      $CI_API_V4_URL/projects/${CI_PROJECT_ID}/packages/pypi dist/*.whl
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

create-gitlab-release:
  stage: deploy
  extends: .load_modules
  tags:
    - ku1
  needs:
    - pypi-deploy
    - verify-release-notes
  script:
    - >-
      curl --fail --show-error --request POST
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --form-string "name=${CI_COMMIT_TAG}"
      --form-string "tag_name=${CI_COMMIT_TAG}"
      --form-string "description=$(cat release-notes.html)"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

create-module-latest:
  stage: deploy
  extends: .load_modules
  tags: 
    - ku1
  needs: 
    - pypi-deploy
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
   - | 
      rm -rf ${PYKU_CI_MODULE}/pyku.latest/.venv 
      uv venv ${PYKU_CI_MODULE}/pyku.latest/.venv 
      source ${PYKU_CI_MODULE}/pyku.latest/.venv/bin/activate
      index_url="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}"
      index_url+="/api/v4/projects/${CI_PROJECT_ID}/packages/pypi/simple"
      uv pip install pyku --upgrade \
        --index-url "$index_url"

pages:
  stage: deploy
  resource_group: pages
  environment:
    name: pages
    url: $CI_PAGES_URL
  needs:
    - documentation
    - job: verify-release-notes
      optional: true
  tags:
    - ku1
  script:
    - echo "Serve documentation per gitlab page"
    - cp -r documentation/ public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'

cleanup:
  stage: cleanup
  tags:
    - ku1
  script:
    - |
      if [ -d "$PYKU_ENVIRONMENT" ]; then 
        rm -rf $PYKU_ENVIRONMENT
      else
        echo "No environment to clean up"
        exit 1
      fi
  when: always
