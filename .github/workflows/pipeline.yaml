name: CI/CD Pipeline

on:
  # GitHub PRs get checks only; maintainers manually sync merged main
  # branches and release tags from the canonical GitLab repository.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  LANGUAGE: "en_US:en"
  LANG: "en_US"
  LC_ALL: C
  PYKU_DATA_DIR: ${{ github.workspace }}/pyku_cache
  XDG_DATA_HOME: ${{ github.workspace }}/pyku_cache
  CARTOPY_DATA_DIR: ${{ github.workspace }}/pyku_cache/cartopy

permissions:
  contents: read

jobs:
  build-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:

      - name: Inspect hardware
        run: |
          echo "CPU Details:"
          lscpu | grep -E '^Thread\(s\) per core|^Core\(s\) per socket|^CPU\(s\)'
          echo "---"
          echo "Memory Details:"
          free -h
          echo "---"
          echo "Disk Space:"
          df -h | grep '^/dev/'

      - uses: actions/checkout@v6

      - name: Install system binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libudunits2-dev libhdf5-dev libnetcdf-dev libproj-dev pandoc

      - name: Cache pyku data
        uses: actions/cache@v5
        with:
          path: ${{ env.PYKU_DATA_DIR }}
          key: global-pyku-data

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Build, test and generate documentation
        run: |
          mkdir -p "$PYKU_DATA_DIR"
          mkdir -p "$CARTOPY_DATA_DIR"
          uv venv
          source .venv/bin/activate
          uv pip install --upgrade pip setuptools wheel cython nbstripout build
          uv build
          WHEEL_PATH=$(ls dist/*.whl)
          uv pip install "$WHEEL_PATH[documentation,cdo_bindings]"

          uv pip install flake8 pytest
          flake8 pyku/
          ipython ./testing/check_notebooks_are_cleared.ipy

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/changelog_release_notes.py "$GITHUB_REF_NAME" >/dev/null
          fi

          python3 -m pytest testing/ -v --tb=short
          sphinx-build -j 1 ./doc/ ./docs
          if [[ ! -s ./doc/savefig/mask_get_mask.png ]]; then
            echo "::error::Missing generated documentation image: mask_get_mask.png"
            exit 1
          fi

      - name: Upload pages artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-and-test
      - deploy
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Generate release notes
        run: >-
          uv run --no-project --with docutils --python 3.12
          python scripts/changelog_release_notes.py
          "$GITHUB_REF_NAME" --format html > release-notes.html

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.html
