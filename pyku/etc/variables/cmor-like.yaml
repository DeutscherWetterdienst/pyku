# Manually-edited configuration for custom CMOR-like variables, which are not
# part of the CORDEX standard.

tdps:
  comment: >-
    CMOR-like output name for near-surface dew-point temperature; COSMO-CLM
    provides this variable as TD_2M.
  long_name: Near-Surface Dew Point Temperature
  standard_name: dew_point_temperature
  units: kelvins
  cmor_units: 'K'
  valid_bounds: [150, 400]
mixr:
  comment: >
      humrs is not defined in the CMOR standard see GRIB2 - TABLE 4.2-0-1
      number 02 Humidity mixing ratio of a parcel of moist air is the
      ratio of the mass of water vapor to the mass of dry air.
  long_name: Near-Surface Water Vapor Mixing Ratio
  standard_name: humidity_mixing_ratio
  units: dimensionless
  cmor_units: '1'
  valid_bounds: [0, 1]
rlns:
  comment: >-
    COSMO-CLM ATHB_S is averaged surface net downward longwave radiation. Its
    metadata identifies surface_net_downward_longwave_flux, and hourly values
    match ALWD_S minus ALWU_S, confirming the positive-downward convention.
  long_name: Averaged Surface Net Downward Longwave Radiation
  standard_name: surface_net_downward_longwave_flux
  units: W m^-2
  cmor_units: 'W m-2'
  valid_bounds: [-3000, 3000]
sfcWind_direction:
  comment: Variable without CORDEX standard
  long_name: Near-Surface Wind Direction
  standard_name: wind_direction
  units: degree
  cmor_units: 'degree'
uhi:
  comment: Custom CMOR-like variable. Not part of CORDEX standard.
  long_name: Canopy Urban Heat Island Intensity
  standard_name: canopy_urban_heat_island_intensity
  units: kelvins
  cmor_units: 'K'
